<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Tags</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        nav a {
            margin-right: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            {% if 'UserID' in session %}
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
            {% endif %}
        </nav>
    </header>
    <main>
        <h1>Document Tags for {{ Name }}</h1>

        <!-- Toggle Filter Form -->
        <form method="post">
            <label>
                <input type="checkbox" name="filter_by_user" 
                       {% if filter_by_user %}checked{% endif %}>
                Show only documents I added
            </label>
            <button type="submit">Apply Filter</button>
        </form>

        <!-- Tags Table -->
        {% if tags %}
            <table>
                <thead>
                    <tr>
                        <th>Tag Description</th>
                        <th>Number of Tags</th>
                    </tr>
                </thead>
                <tbody>
                    {% for tag in tags %}
                        <tr>
                            <td>{{ tag.tag_desc }}</td>
                            <td>{{ tag.no_tags }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No tags found for this user or their lineage.</p>
        {% endif %}
    </main>
</body>
</html>
